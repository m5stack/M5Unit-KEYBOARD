name: Build(arduino-esp32:2.x)

env:
  SKETCH_NAMES_FIND_START: ./examples/UnitUnified
  REQUIRED_LIBRARIES: M5Unified,M5UnitUnified
on:
  push:
    tags-ignore:
      - '*.*.*'
      - 'v*.*.*'
    branches:
      - '*'
    paths:
      - 'src/unit/**.cpp'
      - 'src/unit/**.hpp'
      - 'src/unit/**.h'
      - 'src/unit/**.c'
      - 'test/**.cpp'
      - 'test/**.hpp'
      - 'test/**.h'
      - 'test/**.c'
      - 'examples/UnitUnified/**.ino'
      - 'examples/UnitUnified/**.cpp'
      - 'examples/UnitUnified/**.hpp'
      - 'examples/UnitUnified/**.h'
      - 'examples/UnitUnified/**.c'
      - '**arduino-esp-v2-build-check.yml'
  pull_request:
    paths:
      - 'src/unit/**.cpp'
      - 'src/unit/**.hpp'
      - 'src/unit/**.h'
      - 'src/unit/**.c'
      - 'test/**.cpp'
      - 'test/**.hpp'
      - 'test/**.h'
      - 'test/**.c'
      - 'examples/UnitUnified/**.ino'
      - 'examples/UnitUnified/**.cpp'
      - 'examples/UnitUnified/**.hpp'
      - 'examples/UnitUnified/**.h'
      - 'examples/UnitUnified/**.c'
      - '**arduino-esp-v2-build-check.yml'
  workflow_dispatch:
    inputs:
      runner:
        description: Select runner
        required: true
#        default: '"ubuntu-latest"'
        default: '["self-hosted", "Linux", "X64"]'
        type: choice
        options:
          - '["ubuntu-latest"]'
          - '["self-hosted", "Linux", "X64"]'

jobs:
  build:
    name: ${{ matrix.build-properties }}:${{ matrix.sketch }}:${{matrix.board}}@${{matrix.platform-version}}
#    runs-on: ubuntu-latest
    runs-on: ${{ fromJSON(github.event.inputs.runner || '["self-hosted", "Linux", "X64"]') }}
#    runs-on: ${{ fromJSON(github.event.inputs.runner || '["ubuntu-latest"]') }}

    strategy:
      fail-fast: false
        #max-parallel: 1
      matrix:
        # Change runs-on if startup from act and startup from GitHub Actions
        host: [ubuntu-latest, self-hosted]
        include:
          - host: self-hosted
            runner: ["self-hosted", "Linux", "X64"]
          - host: ubuntu-latest
            runner: ["ubuntu-latest"]



        platform-url:
          - https://espressif.github.io/arduino-esp32/package_esp32_index.json

        sketch:
          - PlotToSerial
          - SimpleDisplay

#        unit:
#          - 

        board:
          - m5stack-atom
          - m5stack-atoms3
          - m5stack-core-esp32
          - m5stack-core2
          - m5stack-coreink
          - m5stack-cores3
          - m5stack-fire

        platform-version:
          - 2.0.17

        platform:
          - esp32

        archi:
          - esp32

        build-properties:
          - "-DUSING_UNIT_CARDKB"
          - "-DUSING_UNIT_FACES_QWERTY"

        exclude:
          - board: m5stack-atom
            build-properties: "-DUSING_UNIT_FACES_QWERTY"
          - board: m5stack-atom
            sketch: SimpleDisplay
          - board: m5stack-atoms3
            build-properties: "-DUSING_UNIT_FACES_QWERTY"
          - board: m5stack-coreink
            build-properties: "-DUSING_UNIT_FACES_QWERTY"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # Build 
      - name: Compile examples
        uses: ArminJo/arduino-test-compile@master
        with:
          arduino-board-fqbn: ${{ matrix.platform }}:${{ matrix.archi }}:${{ matrix.board }}
          arduino-platform: ${{ matrix.platform }}:${{ matrix.archi }}@${{ matrix.platform-version }}
          platform-url: ${{ matrix.platform-url }}
          required-libraries: ${{ env.REQUIRED_LIBRARIES }}
          extra-arduino-cli-args: ${{ matrix.cli-args }}
          build-properties: ${{ matrix.build-properties }}
          sketch-names: ${{ matrix.sketch }}.ino
          sketch-names-find-start: ${{ env.SKETCH_NAMES_FIND_START }}/${{ matrix.unit }}
          #sketches-exclude: ${{ matrix.sketches-exclude }}
