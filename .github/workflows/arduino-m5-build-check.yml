name: Build(arduino-m5stack)

env:
  SKETCH_NAMES_FIND_START: ./examples/UnitUnified
  REQUIRED_LIBRARIES: M5Unified,M5UnitUnified

on:
  push:
    tags-ignore:
      - '*.*.*'
      - 'v*.*.*'
    branches:
      - '*'
    paths:
      - 'src/**.cpp'
      - 'src/**.hpp'
      - 'src/**.h'
      - 'src/**.c'
      - 'examples/UnitUnified/**.ino'
      - 'examples/UnitUnified/**.cpp'
      - 'examples/UnitUnified/**.hpp'
      - 'examples/UnitUnified/**.h'
      - 'examples/UnitUnified/**.c'
      - '.github/workflows/arduino-m5-build-check.yml'
  pull_request:
    paths:
      - 'src/**.cpp'
      - 'src/**.hpp'
      - 'src/**.h'
      - 'src/**.c'
      - 'examples/UnitUnified/**.ino'
      - 'examples/UnitUnified/**.cpp'
      - 'examples/UnitUnified/**.hpp'
      - 'examples/UnitUnified/**.h'
      - 'examples/UnitUnified/**.c'
      - '.github/workflows/arduino-m5-build-check.yml'
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.build-properties }}:${{ matrix.sketch }}:${{matrix.board}}@${{matrix.platform-version}}
    runs-on: ubuntu-latest
    timeout-minutes: 12

    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        platform-url:
          - https://m5stack.oss-cn-shenzhen.aliyuncs.com/resource/arduino/package_m5stack_index.json

        sketch:
          - PlotToSerial

        board:
          - arduino_nesso_n1
          - m5stack_atom
          - m5stack_atoms3
          - m5stack_atoms3r
          - m5stack_capsule
          - m5stack_cardputer
          - m5stack_core
          - m5stack_core2
          - m5stack_coreink
          - m5stack_cores3
          - m5stack_dial
          - m5stack_dinmeter
          - m5stack_fire
          - m5stack_nano_c6
          - m5stack_paper
          - m5stack_papers3
          - m5stack_stamp_s3
          - m5stack_stickc
          - m5stack_stickc_plus
          - m5stack_stickc_plus2
          - m5stack_sticks3
          - m5stack_tab5

        platform-version:
          - 3.2.5

        platform:
          - m5stack

        archi:
          - esp32

        build-properties:
          - "-DUSING_UNIT_CARDKB"
          - "-DUSING_UNIT_CARDKB2 -DUSING_I2C_FOR_CARDKB2"
          - "-DUSING_UNIT_CARDKB2 -DUSING_UART_FOR_CARDKB2"
          - "-DUSING_UNIT_FACES_QWERTY"

        exclude:
          - board: arduino_nesso_n1
            build-properties: "-DUSING_UNIT_FACES_QWERTY"
          - board: m5stack_atom
            build-properties: "-DUSING_UNIT_FACES_QWERTY"
          - board: m5stack_atoms3
            build-properties: "-DUSING_UNIT_FACES_QWERTY"
          - board: m5stack_atoms3r
            build-properties: "-DUSING_UNIT_FACES_QWERTY"
          - board: m5stack_capsule
            build-properties: "-DUSING_UNIT_FACES_QWERTY"
          - board: m5stack_cardputer
            build-properties: "-DUSING_UNIT_FACES_QWERTY"
          - board: m5stack_coreink
            build-properties: "-DUSING_UNIT_FACES_QWERTY"
          - board: m5stack_dial
            build-properties: "-DUSING_UNIT_FACES_QWERTY"
          - board: m5stack_dinmeter
            build-properties: "-DUSING_UNIT_FACES_QWERTY"
          - board: m5stack_nano_c6
            build-properties: "-DUSING_UNIT_FACES_QWERTY"
          - board: m5stack_paper
            build-properties: "-DUSING_UNIT_FACES_QWERTY"
          - board: m5stack_papers3
            build-properties: "-DUSING_UNIT_FACES_QWERTY"
          - board: m5stack_stamp_s3
            build-properties: "-DUSING_UNIT_FACES_QWERTY"
          - board: m5stack_stickc
            build-properties: "-DUSING_UNIT_FACES_QWERTY"
          - board: m5stack_stickc_plus
            build-properties: "-DUSING_UNIT_FACES_QWERTY"
          - board: m5stack_stickc_plus2
            build-properties: "-DUSING_UNIT_FACES_QWERTY"
          - board: m5stack_sticks3
            build-properties: "-DUSING_UNIT_FACES_QWERTY"
          - board: m5stack_tab5
            build-properties: "-DUSING_UNIT_FACES_QWERTY"

        include:
          # SimpleDisplay: Core only
          - sketch: SimpleDisplay
            board: m5stack_core
            platform-version: 3.2.5
            platform: m5stack
            archi: esp32
            platform-url: https://m5stack.oss-cn-shenzhen.aliyuncs.com/resource/arduino/package_m5stack_index.json
            build-properties: "-DUSING_UNIT_CARDKB"
          - sketch: SimpleDisplay
            board: m5stack_core
            platform-version: 3.2.5
            platform: m5stack
            archi: esp32
            platform-url: https://m5stack.oss-cn-shenzhen.aliyuncs.com/resource/arduino/package_m5stack_index.json
            build-properties: "-DUSING_UNIT_CARDKB2 -DUSING_I2C_FOR_CARDKB2"
          - sketch: SimpleDisplay
            board: m5stack_core
            platform-version: 3.2.5
            platform: m5stack
            archi: esp32
            platform-url: https://m5stack.oss-cn-shenzhen.aliyuncs.com/resource/arduino/package_m5stack_index.json
            build-properties: "-DUSING_UNIT_CARDKB2 -DUSING_UART_FOR_CARDKB2"
          - sketch: SimpleDisplay
            board: m5stack_core
            platform-version: 3.2.5
            platform: m5stack
            archi: esp32
            platform-url: https://m5stack.oss-cn-shenzhen.aliyuncs.com/resource/arduino/package_m5stack_index.json
            build-properties: "-DUSING_UNIT_FACES_QWERTY"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare libraries list
        id: libs
        run: |
          {
            echo "yaml<<EOF"
            echo "$REQUIRED_LIBRARIES" | tr ',' '\n' | while read -r lib; do
              echo "- name: $lib"
            done
            echo "- source-path: ./"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Compile examples
        uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.platform }}:${{ matrix.archi }}:${{ matrix.board }}
          platforms: |
            - name: ${{ matrix.platform }}:${{ matrix.archi }}
              source-url: ${{ matrix.platform-url }}
              version: ${{ matrix.platform-version }}
          libraries: ${{ steps.libs.outputs.yaml }}
          sketch-paths: |
            - examples/UnitUnified/${{ matrix.sketch }}
          cli-compile-flags: |
            - --build-property
            - build.extra_flags=${{ matrix.build-properties }}
