name: Build(platformio)

on:
  push:
    tags-ignore:
      - '*.*.*'
      - 'v*.*.*'
    branches:
      - '*'
    paths:
      - 'src/**.cpp'
      - 'src/**.hpp'
      - 'src/**.h'
      - 'src/**.c'
      - 'examples/UnitUnified/**.ino'
      - 'examples/UnitUnified/**.cpp'
      - 'examples/UnitUnified/**.hpp'
      - 'examples/UnitUnified/**.h'
      - 'examples/UnitUnified/**.c'
      - '.github/workflows/platformio-build-check.yml'
      - 'platformio.ini'
  pull_request:
    paths:
      - 'src/**.cpp'
      - 'src/**.hpp'
      - 'src/**.h'
      - 'src/**.c'
      - 'examples/UnitUnified/**.ino'
      - 'examples/UnitUnified/**.cpp'
      - 'examples/UnitUnified/**.hpp'
      - 'examples/UnitUnified/**.h'
      - 'examples/UnitUnified/**.c'
      - '.github/workflows/platformio-build-check.yml'
      - 'platformio.ini'
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.unit }}:${{ matrix.example }}@${{ matrix.board }}:${{ matrix.framework }}:${{ matrix.espressif32 }}
    runs-on: ubuntu-latest
    timeout-minutes: 12

    strategy:
      fail-fast: false
      max-parallel: 20

      matrix:
        example:
          - PlotToSerial

        unit:
          - UnitCardKB
          - UnitCardKB2_I2C
          - UnitCardKB2_UART
          - UnitFacesQWERTY

        board:
          - Core
          - Core2
          - CoreS3
          - Fire
          - StampS3
          - Dial
          - Atom
          - AtomS3
          - AtomS3R
          - NanoC6
          - StickCPlus
          - StickCPlus2
          - StickS3
          - Paper
          - CoreInk
          - Cardputer
          - Tab5
          - NessoN1

        framework:
          - Arduino

        espressif32:
          - latest

        exclude:
          # FacesQWERTY: Core/Core2/CoreS3/Fire only
          - board: StampS3
            unit: UnitFacesQWERTY
          - board: Dial
            unit: UnitFacesQWERTY
          - board: Atom
            unit: UnitFacesQWERTY
          - board: AtomS3
            unit: UnitFacesQWERTY
          - board: AtomS3R
            unit: UnitFacesQWERTY
          - board: NanoC6
            unit: UnitFacesQWERTY
          - board: StickCPlus
            unit: UnitFacesQWERTY
          - board: StickCPlus2
            unit: UnitFacesQWERTY
          - board: StickS3
            unit: UnitFacesQWERTY
          - board: Paper
            unit: UnitFacesQWERTY
          - board: CoreInk
            unit: UnitFacesQWERTY
          - board: Cardputer
            unit: UnitFacesQWERTY
          - board: Tab5
            unit: UnitFacesQWERTY
          - board: NessoN1
            unit: UnitFacesQWERTY

        include:
          # SimpleDisplay: Core only for each unit
          - example: SimpleDisplay
            unit: UnitCardKB
            board: Core
            framework: Arduino
            espressif32: latest
          - example: SimpleDisplay
            unit: UnitCardKB2_I2C
            board: Core
            framework: Arduino
            espressif32: latest
          - example: SimpleDisplay
            unit: UnitCardKB2_UART
            board: Core
            framework: Arduino
            espressif32: latest
          - example: SimpleDisplay
            unit: UnitFacesQWERTY
            board: Core
            framework: Arduino
            espressif32: latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install intelhex
        run: pip install intelhex

      - name: Build examples
        uses: karniv00l/platformio-run-action@v1
        with:
          environments: ${{ matrix.unit != '' && format('{0}_{1}_{2}_{3}_{4}', matrix.unit, matrix.example, matrix.board, matrix.framework, matrix.espressif32) || format('{0}_{1}_{2}_{3}', matrix.example, matrix.board, matrix.framework, matrix.espressif32) }}
#         targets:
          project-dir: "./"
          project-conf: "./platformio.ini"
#          jobs: 6
#          silent: false
#          verbose: true
#          disable-auto-clean: false
