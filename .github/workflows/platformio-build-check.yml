name: Build(platformio)

on:
  push:
    tags-ignore:
      - '*.*.*'
      - 'v*.*.*'
    branches:
      - '*'
    paths:
      - 'src/unit/**.cpp'
      - 'src/unit/**.hpp'
      - 'src/unit/**.h'
      - 'src/unit/**.c'
      - 'examples/UnitUnified/**.ino'
      - 'examples/UnitUnified/**.cpp'
      - 'examples/UnitUnified/**.hpp'
      - 'examples/UnitUnified/**.h'
      - 'examples/UnitUnified/**.c'
      - '**/platformio-build-check.yml'
      - '**platformio.ini'
  pull_request:
    paths:
      - 'src/unit/**.cpp'
      - 'src/unit/**.hpp'
      - 'src/unit/**.h'
      - 'src/unit/**.c'
      - 'examples/UnitUnified/**.ino'
      - 'examples/UnitUnified/**.cpp'
      - 'examples/UnitUnified/**.hpp'
      - 'examples/UnitUnified/**.h'
      - 'examples/UnitUnified/**.c'
      - '**/platformio-build-check.yml'
      - '**platformio.ini'
  workflow_dispatch:
    inputs:
      runner:
        description: Select runner
        required: true
#        default: '"ubuntu-latest"'
        default: '["self-hosted", "Linux", "X64"]'
        type: choice
        options:
          - '["ubuntu-latest"]'
          - '["self-hosted", "Linux", "X64"]'

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.unit }}:${{ matrix.example }}@${{ matrix.board }}:${{ matrix.framework }}:${{ matrix.espressif32 }}
    runs-on: ${{ fromJSON(github.event.inputs.runner || '["self-hosted", "Linux", "X64"]') }}
#    runs-on: ubuntu-latest
    timeout-minutes: 5

    strategy:
      fail-fast: false
      #max-parallel: 1
      
      matrix:
        example:
          - PlotToSerial
          - SimpleDisplay

        unit:
          - UnitCardKB
          - UnitFacesQWERTY

        board:
          - Core
          - Core2
          - CoreS3
          - Fire
          - StampS3
          - Dial
          - AtomMatrix
          - AtomS3
          - AtomS3R
          - NanoC6
          - StickCPlus
          - StickCPlus2
          - Paper
          - CoreInk

        framework:
          - Arduino

        espressif32:
          - latest
#          - '5_4_0'
#          - '4_4_0'

        exclude:
          - board: StampS3
            unit: UnitFacesQWERTY
          - board: StampS3
            example: SimpleDisplay
          - board: Dial
            unit: UnitFacesQWERTY
          - board: AtomMatrix
            unit: UnitFacesQWERTY
          - board: AtomMatrix
            example: SimpleDisplay
          - board: AtomS3
            unit: UnitFacesQWERTY
          - board: AtomS3R
            unit: UnitFacesQWERTY
          - board: NanoC6
            unit: UnitFacesQWERTY
          - board: NanoC6
            example: SimpleDisplay
          - board: StickCPlus
            unit: UnitFacesQWERTY
          - board: StickCPlus2
            unit: UnitFacesQWERTY
          - board: Paper
            unit: UnitFacesQWERTY
          - board: CoreInk
            unit: UnitFacesQWERTY

#          - board: CoreS3
#            espressif32: '5_4_0'
#          - board: CoreS3
#            espressif32: '4_4_0'
#          - board: StampS3
#            espressif32: '5_4_0'
#          - board: StampS3
#            espressif32: '4_4_0'
#          - board: AtomS3
#            espressif32: '5_4_0'
#          - board: AtomS3
#            espressif32: '4_4_0'
#          - board: Dial
#            espressif32: '5_4_0'
#          - board: Dial
#            espressif32: '4_4_0'
#          - board: NanoC6
#            espressif32: '5_4_0'
#          - board: NanoC6
#            espressif32: '4_4_0'
#          - board: StickCPlus
#            espressif32: '5_4_0'
#          - board: StickCPlus
#            espressif32: '4_4_0'
#          - board: Paper
#            espressif32: '5_4_0'
#          - board: Paper
#            espressif32: '4_4_0'

    steps:
      - name: Which runner
        run: echo "RunsOn=${{ github.event.inputs.runner || 'self-hosted' }}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Build examples
        uses: karniv00l/platformio-run-action@v1
        with:
          environments: ${{ matrix.unit && format('{0}_{1}_{2}_{3}_{4}', matrix.unit, matrix.example, matrix.board, matrix.framework, matrix.espressif32) || format('{0}_{1}_{2}_{3}', matrix.example, matrix.board, matrix.framework, matrix.espressif32) }}
#         targets:
          project-dir: "./"
          project-conf: "./platformio.ini"
#          jobs: 6
#          silent: false
#          verbose: true
#          disable-auto-clean: false
