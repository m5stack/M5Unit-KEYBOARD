description: Library for M5Stack UNIT KEYBOARD using M5UnitUnified
url: https://github.com/m5stack/M5Unit-KEYBOARD
issues: https://github.com/m5stack/M5Unit-KEYBOARD/issues
license: MIT
version: "0.1.0"

dependencies:
  idf: ">=5.0"
  # Not yet on the ESP component registry; use the official git + main during migration.
  m5stack/M5UnitUnified:
    git: https://github.com/m5stack/M5UnitUnified.git
    version: main

targets:
  - esp32p4

files:
  exclude:
    - "docs/**"
    - "examples/**"
    - "test/**"
    - "boards/**"
    - "platformio.ini"
    - "library.json"
    - "library.properties"
    - "*_env.ini"
    - ".clang-format"
    - ".gitignore"
